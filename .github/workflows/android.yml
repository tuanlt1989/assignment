name: Android build

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.flavors.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Question banks are rebuilt and committed
        run: |
          python3 tool/build_banks.py
          git diff --exit-code -- assets/banks || (echo "Run python3 tool/build_banks.py and commit assets/banks" && exit 1)
      - name: Exam apps - analyze and test
        run: flutter pub get && flutter analyze && flutter test
      - name: Puzzle games - analyze and test
        working-directory: games
        run: flutter pub get && flutter analyze && flutter test
      - id: flavors
        name: List apps (one build job per apps/*.json and games/apps/*.json)
        run: |
          {
            for f in apps/*.json; do jq -nc --arg f "$(basename "$f" .json)" '{dir: ".", flavor: $f}'; done
            for f in games/apps/*.json; do jq -nc --arg f "$(basename "$f" .json)" '{dir: "games", flavor: $f}'; done
          } | jq -sc . > flavors.json
          echo "list=$(cat flavors.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.check.outputs.flavors) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Release signing (only if the upload key secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the upload key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: builds are debug-signed (fine for testing, not for Play upload)."
          fi
      - name: Build AAB (for Google Play) and APK (for testing)
        working-directory: ${{ matrix.app.dir }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # versionCode = minutes since 2026-01-01, shared with publish.yml, so
          # every build (from either workflow) is higher than the last one.
          BUILD=$(( ($(date +%s) - 1767225600) / 60 ))
          flutter build appbundle --release --flavor ${{ matrix.app.flavor }} --build-number $BUILD
          flutter build apk --release --flavor ${{ matrix.app.flavor }} --build-number $BUILD
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.flavor }}-build${{ github.run_number }}
          path: |
            ${{ matrix.app.dir }}/build/app/outputs/bundle/${{ matrix.app.flavor }}Release/*.aab
            ${{ matrix.app.dir }}/build/app/outputs/flutter-apk/app-${{ matrix.app.flavor }}-release.apk
          if-no-files-found: error

  # Gathers AAB + store listing + images + product icon + UPLOAD.md per app into
  # play-upload/<NN>-<id>/ and publishes one zip per app on the "play-upload"
  # release (a fixed link that does not expire like artifacts do).
  package:
    needs: build
    if: github.ref == 'refs/heads/exam-prep-apps'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Build play-upload folder
        run: python3 tool/pack_upload.py --out play-upload --aab-dir "$RUNNER_TEMP/artifacts" --zip
      - name: Publish release "play-upload"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Update in place (no delete), so the links never 404 during a build.
          TITLE="Play upload – build ${{ github.run_number }}"
          NOTES="One zip per app: AAB (signed), store texts for every language, icon, feature graphic, screenshots, in-app product icon and UPLOAD.md with every Play Console step. Commit $GITHUB_SHA."
          if gh release view play-upload >/dev/null 2>&1; then
            gh release upload play-upload play-upload/*.zip play-upload/README.md --clobber
            gh release edit play-upload --title "$TITLE" --notes "$NOTES"
          else
            gh release create play-upload --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" \
              play-upload/*.zip play-upload/README.md
          fi
