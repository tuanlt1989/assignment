name: Emulator test

# Actions → Emulator test → Run workflow: builds each chosen app, runs it on an
# Android 14 emulator (KVM), taps through it, fires 500 random events and keeps
# screenshots, a screen recording and logcat as artifacts (emulator-<id>).
on:
  # Also runs (all apps) when this workflow or the test script changes.
  push:
    branches: [exam-prep-apps]
    paths: [.github/workflows/emulator.yml, tool/emulator_smoke.sh]
  workflow_dispatch:
    inputs:
      apps:
        description: "App ids, comma-separated, or 'all'"
        required: true
        default: all

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          APPS: ${{ inputs.apps || 'all' }}
        run: |
          if [ "$APPS" = "all" ]; then
            ids=$(ls apps/*.json games/apps/*.json | xargs -n1 basename | sed 's/\.json$//')
          else
            ids=$(echo "$APPS" | tr ',' '\n' | tr -d ' ')
          fi
          for id in $ids; do
            if [ -f "apps/$id.json" ]; then f=apps/$id.json; d=.
            elif [ -f "games/apps/$id.json" ]; then f=games/apps/$id.json; d=games
            else echo "::error::Unknown app '$id'"; exit 1; fi
            jq -c --arg d "$d" '{dir: $d, flavor: .id, pkg: .applicationId}' "$f"
          done | jq -sc . > m.json
          echo "matrix=$(cat m.json)" >> "$GITHUB_OUTPUT"

  run:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Build APK
        working-directory: ${{ matrix.app.dir }}
        run: flutter build apk --release --flavor ${{ matrix.app.flavor }} --target-platform android-x64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator (Android 14, Pixel 6)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tool/emulator_smoke.sh ${{ matrix.app.dir }}/build/app/outputs/flutter-apk/app-${{ matrix.app.flavor }}-release.apk ${{ matrix.app.pkg }} emulator-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-${{ matrix.app.flavor }}
          path: emulator-out
          if-no-files-found: warn
